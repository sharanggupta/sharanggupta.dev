name: Refresh open-source contributions

# Once a day: fetch the merged pull requests and star counts from GitHub, write a note for any new
# pull request with Claude Code (on the Claude subscription, through CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`), and open a pull request with the changes for a quick read before they go live.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/contributions
          title: "Open source: refresh contributions"
          commit-message: "Open source: refresh the contributions data from GitHub"
          body: |
            The daily refresh of the open-source contributions: pull requests and star counts from GitHub,
            and a note written by Claude Code for every pull request that had none. Read the new notes in
            `content/open-source.notes.json` (`"source": "claude"`), then merge.
          delete-branch: true
