name: Refresh open-source contributions

# Once a day: fetch the merged pull requests and star counts from GitHub, write a note for any new
# pull request with Claude Code (on the Claude subscription, through CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`), and commit the result to main, which Vercel deploys. A day with nothing new
# commits nothing. The run's log says what was written; generated notes carry "source": "claude".

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      rewrite:
        description: "Write this pull request's note again (its URL), for example to check the token"
        required: false
        type: string

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code
      - run: npm run contributions -- ${{ inputs.rewrite && format('--rewrite {0}', inputs.rewrite) || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - run: npm test
      - name: Commit what changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/open-source.snapshot.json content/open-source.projects.json content/open-source.notes.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Open source: refresh the contributions data from GitHub"
            git push
          fi
